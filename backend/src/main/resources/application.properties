
server.port = ${SERVER_PORT:9025}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}

spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.query.native.prefer_jdbc_datetime_types=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.jackson.use-jackson2-defaults=true

# schema.sql runs after Hibernate has created or updated the tables
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

app.mail.from=${MAIL_FROM:probucket@info.co.in}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
# Renewed on every refresh, so this is how long someone can stay away before logging in again
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# Must be true when the site is served over HTTPS
app.jwt.cookie-secure=${COOKIE_SECURE:false}

# Task images live on disk here; a Docker volume in docker-compose.yml
app.attachments.dir=${ATTACHMENTS_DIR:attachments}
# Images are up to 5 MB each and 10 per task (AttachmentService); one upload carries at most 10
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=51MB
# Reads an over-large upload to the end, so the browser gets the "too large" message instead of a dropped connection
server.tomcat.max-swallow-size=60MB

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Used to build the links inside emails
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

