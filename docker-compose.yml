services:
  postgresdb:
    image: postgres:alpine3.17
    container_name: postgresqldb
    ports:
      - 5432:5432
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from here.
    # POSTGRES_DB is created automatically only when the data volume is empty.
    env_file: ./backend/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h localhost: TCP only opens after the init scripts have finished
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - probucketool

  # Creates the app database if it is missing (e.g. on a volume initialized before POSTGRES_DB was set)
  postgresdb_init:
    image: postgres:alpine3.17
    container_name: postgresqldb_init
    depends_on:
      postgresdb:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      - PGHOST=postgresdb
      - PGDATABASE=postgres
    entrypoint: ["sh", "-c"]
    command:
      - >-
        export PGUSER="$$POSTGRES_USER" PGPASSWORD="$$POSTGRES_PASSWORD";
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$$POSTGRES_DB'" | grep -q 1
        || psql -c "CREATE DATABASE \"$$POSTGRES_DB\""
    restart: "no"
    networks:
      - probucketool

  # Queue for emails and other slow work. Admin page: http://localhost:15672
  # (user/password: RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS from backend/.env)
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: probucket_rabbitmq
    # RabbitMQ keeps its data under the node name, which comes from the hostname
    hostname: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    env_file: ./backend/.env
    # Queued jobs and the dead-letter queues survive a restart
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - probucketool

  # Cache only, so nothing is written to disk
  redis:
    image: redis:7.4-alpine
    container_name: probucket_redis
    ports:
      - 6379:6379
    env_file: ./backend/.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - probucketool

  probucket_backend:
    container_name: pro_tool_backend
    build: ./backend
    ports:
      - 9025:9025
    depends_on:
      postgresdb_init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      - DB_HOST=postgresdb
      - DB_PORT=5432
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ATTACHMENTS_DIR=/application/attachments
    # Task images; kept when the container is rebuilt
    volumes:
      - attachments-data:/application/attachments
    restart: on-failure
    networks:
      - probucketool

  probucket_frontend:
    container_name: pro_tool_frontend
    # frontend/.env is picked up by the React build inside the image
    build: ./frontend
    ports:
      - 3000:80
    depends_on:
      - probucket_backend


volumes:
  postgres-data:
    driver: local
  attachments-data:
    driver: local
  rabbitmq-data:
    driver: local

networks:
  probucketool:
